name: Atelier checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
        working-directory: apps/web
      - run: cargo fmt --all --check
        working-directory: services/api
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: services/api
      - run: cargo test --locked --workspace
        working-directory: services/api
      - run: cargo check --locked --workspace
        working-directory: services/api
      - run: npm run typecheck && npm run lint && npm run format:check && npm run test:mock && npm run build
        working-directory: apps/web
      - run: python scripts/check_contract.py
      - run: node --test tests/baseline.test.cjs
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: services/api
      # Keep the complete report, including moderate findings, in CI logs.
      - run: npm audit
        working-directory: apps/web

  identity-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atelier_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atelier_test -d atelier_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://atelier_test:isolated_ci_only@127.0.0.1:5432/atelier_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked -p atelier-auth --test schema -- --ignored
        working-directory: services/api
