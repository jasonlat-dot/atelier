name: Atelier checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
        working-directory: apps/web
      - run: python -m unittest discover -s tests -p "test_ci_apt_sources.py"
      - run: node --check scripts/dev.mjs
      - run: node --test tests/dev-proxy.test.mjs
      - run: cargo fmt --all --check
        working-directory: services/api
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        working-directory: services/api
      - run: cargo test --locked --workspace
        working-directory: services/api
      - run: cargo check --locked --workspace
        working-directory: services/api
      - run: npm run typecheck && npm run lint && npm run format:check && npm run test:mock && npm run build
        working-directory: apps/web
      - run: python scripts/check_contract.py
      - run: node --test tests/baseline.test.cjs
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - run: npm run test:e2e:http
        working-directory: apps/web
      - run: cargo install cargo-audit --locked
      - run: cargo audit
        working-directory: services/api
      # Report both ecosystems even when the Rust audit fails.
      - if: ${{ always() }}
        run: npm audit
        working-directory: apps/web

  identity-schema:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atelier_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: atelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atelier_test -d atelier_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      DATABASE_URL: postgres://atelier_test:isolated_ci_only@127.0.0.1:5432/atelier_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache video apt packages
        uses: actions/cache@v4
        with:
          path: .tools/ci-apt-archives/*.deb
          key: ${{ runner.os }}-${{ runner.arch }}-apt-noble-video-v1-${{ hashFiles('scripts/ci/prepare_apt_sources.py') }}
      - name: Verify video test tools
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for tool in ffmpeg ffprobe timeout prlimit; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "Missing video test tool: $tool"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            sudo python3 scripts/ci/prepare_apt_sources.py --root /etc/apt
            mkdir -p "$GITHUB_WORKSPACE/.tools/ci-apt-archives/partial"
            sudo timeout 120s apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 300s apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Dir::Cache::archives="$GITHUB_WORKSPACE/.tools/ci-apt-archives" install -y --no-install-recommends ffmpeg util-linux coreutils
          fi
          for tool in ffmpeg ffprobe timeout prlimit; do command -v "$tool"; done
          ffmpeg -version
          ffprobe -version
          timeout --version
          prlimit --version
      - run: cargo test --locked -p atelier-auth -p atelier-wallet -p atelier-assets -p atelier-upstream -p atelier-generation -p atelier-canvas -p atelier-chat --tests -- --ignored
        working-directory: services/api
      - run: cargo test --locked -p atelier-app --test wallet_http -- --ignored
        working-directory: services/api
      - run: cargo test --locked -p atelier-app --test assets_schema --test assets_http --test upstream_http --test generation_http --test canvas_http --test chat_http -- --ignored
        working-directory: services/api
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e:auth
        working-directory: apps/web
