function sendChat(){const inp=document.getElementById('chat-input');if(!inp||!inp.value.trim())return;const text=inp.value.trim();state.chat.push({role:'user',text});let wantsVideo=/视频|短片|镜头|动效|动画/.test(text),wantsImage=/生图|图片|海报|插画|设计|画|视觉/.test(text);let reply=wantsVideo?'我识别到这是「视频创作」意图。建议先确定时长与镜头语言，并用参考图指定首帧。可以直接打开画布开始生成视频。':wantsImage?'我识别到这是「视觉创作」意图。可以先在画布创建提示词节点，选择图片质量与比例，再把生成结果连接为后续视频的参考帧。':'我已理解你的需求。建议把目标、参考素材、输出比例和品牌风格拆分，再用节点工作流连续迭代，保留每次生成的溯源信息。';state.chat.push({role:'assistant',text:reply,meta:'意图 '+(wantsVideo?'视频生成':wantsImage?'图片创作':'一般对话')+' · 上下文 1.4k / 32k（演示）'});render();toast('已回复 · 本地规则模拟')}

function modal(){const m=state.modal;if(!m)return '';let body='',w='';if(m.kind==='media'){let n=getNode(m.id);if(!n){state.modal=null;return ''}w='media-modal';body=`<div class="spread" style="margin-bottom:14px"><h3 style="margin:0">${e(n.title)}</h3>${button('modal-close',icon('close'),'btn ghost square')}</div>${n.type==='video'?`<video controls autoplay muted src="${e(n.src)}" poster="${e(n.poster||'')}"></video>`:`<img src="${e(n.src)}" alt="${e(n.title)}">`}<div class="spread" style="margin-top:15px"><div class="small muted">${e(n.model||'上传素材')} · ${n.type==='video'?'视频':'图片'}</div><div class="inline-actions">${button('add-ref','加入参考','btn small')}${button('download-media',icon('download','sm')+' 下载源文件','btn small')}${button('modal-close','关闭','btn small')}</div></div>`}
else if(m.kind==='user-credit'){let u=state.users.find(x=>x.id===m.id);body=`<h3>调整积分 · ${e(u.name)}</h3><p>手动充值或扣减，模拟环境仅修改本地数据；生产环境需要事务、审计日志和管理员二次确认。</p><label class="form-label">调整量（负数为扣减）</label><input id="credit-amount" class="field" type="number" placeholder="例如 300" value="300"><label class="form-label" style="margin-top:15px">调整原因</label><input id="credit-note" class="field" placeholder="例如 订单补偿" value="管理员人工补偿"><div class="modal-actions">${button('modal-close','取消','btn')}${button('submit-credit','确认调整','btn primary')}</div>`}
else if(m.kind==='model-edit'){let mm=state.models.find(x=>x.id===m.id);body=`<h3>模型价格 · ${e(mm.name)}</h3><p>这里只是基础价，正式系统还需按画质、分辨率、时长、并发成本等服务端报价。</p><label class="form-label">基础积分价格</label><input class="field" id="model-cost" type="number" min="0" value="${mm.cost}"><div class="modal-actions">${button('modal-close','取消','btn')}${button('submit-model-cost','确认','btn primary')}</div>`}
else if(m.kind==='new-project'){body=`<h3>新建画布</h3><p>画布支持图像、视频、文本、配置与任务节点，结构将单独存储。</p><label class="form-label">画布名称</label><input id="project-title" class="field" value="新的创作画布" autofocus><div class="modal-actions">${button('modal-close','取消','btn')}${button('submit-project','创建画布','btn primary')}</div>`}
else if(m.kind==='credits'){body=`<h3>余额不足</h3><p>当前余额：${credits().toLocaleString()} 积分。本次任务预估需要 ${cost()} 积分，不能继续提交。可以到积分中心购买模拟套餐或签到。</p><div class="modal-actions">${button('modal-close','取消','btn')}${button('go-wallet','前往积分中心','btn primary')}</div>`}
else if(m.kind==='provider'){body=`<h3>添加授权供应商凭据池</h3><p>生产环境密钥应进入服务端加密存储 / KMS，浏览器只展示脱敏标识。演示不会收集真实密钥。</p><label class="form-label">供应商名称</label><input id="provider-name" class="field" placeholder="例如 Authorized Image API"><div class="modal-actions">${button('modal-close','取消','btn')}${button('submit-provider','添加演示供应商','btn primary')}</div>`}
else if(m.kind==='audit'){body=`<h3>安全审计 · 示例记录</h3><div class="timeline" style="padding-top:15px"><div class="event"><strong>11:43 · 管理员修改模型价格</strong>操作人 Jordan Lee · 记录旧值与新值</div><div class="event"><strong>10:51 · 禁用违规用户</strong>服务端持久会话即时失效 · 拒绝继续请求</div><div class="event"><strong>09:35 · 积分账本检查成功</strong>无负余额与重复退款</div></div><div class="modal-actions">${button('modal-close','关闭','btn')}</div>`}
else if(m.kind==='simple'){body=`<h3>${e(m.title)}</h3><p>${e(m.text)}</p><div class="modal-actions">${button('modal-close','确定','btn primary')}</div>`}
return `<div class="modal-back" id="modal-back"><div class="modal ${w}">${body}</div></div>`}
function toast(msg,bad=false){let el=document.getElementById('toast-area');if(!el)return;const item=document.createElement('div');item.className='toast'+(bad?' bad':'');item.textContent=msg;el.appendChild(item);setTimeout(()=>{item.remove()},3500)}
function navigate(p){state.page=p;state.modal=null;state.roleOpen=false;if(p==='canvas')state.selected=state.selected||nodes()[0]?.id;render()}
function downloadText(filename,data,type='application/json'){const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function mediaDownload(n){if(!n?.src)return;const a=document.createElement('a');a.href=n.src;a.download=n.title.replace(/[\\/:*?"<>|]/g,'_')+(n.type==='video'?'.mp4':'.svg');a.target='_blank';document.body.appendChild(a);a.click();a.remove()}
function imageCopy(){const n=getNode(state.selected);if(!n)return;return clone(n)}
let clipboard=null;
function canvasTaskFocus(t){if(!t)return;state.userKey=t.userKey;state.projectId=t.projectId;state.page='canvas';state.selected=t.resultNodeIds?.[0]||t.nodeId;state.activeInspector='tasks';render();let n=getNode(state.selected);if(n){const r=document.querySelector('#canvas-center').getBoundingClientRect(),v=canvas().view;v.x=r.width/2-(n.x+n.w/2)*v.scale;v.y=r.height/2-(n.y+n.h/2)*v.scale;renderWorld()}}
function execute(action,el){const id=el.dataset.id, val=el.dataset.value;switch(action){
case 'go-canvas':navigate('canvas');break;case 'go-wallet':navigate('wallet');break;case 'notify':toast('暂无新的通知');break;
case 'switch-role':state.roleOpen=!state.roleOpen;render();break;case 'role':state.userKey=id;state.roleOpen=false;state.selected=null;state.projectId='p-morrow';state.page='canvas';state.referenceIds=[];render();toast('已切换演示身份：'+current().role);break;
case 'open-project':state.projectId=id;state.selected=null;navigate('canvas');break;case 'new-project':state.modal={kind:'new-project'};render();break;
case 'submit-project':{let title=document.querySelector('#project-title').value.trim();if(!title)title='新画布';const pid=uid('p');state.projects.unshift({id:pid,title,meta:'新画布 · 图片 / 视频',updated:'刚刚',covers:['arch','bloom','desert']});state.projectId=pid;state.canvasMap[canvasKey()]={nodes:[],edges:[],view:{x:180,y:160,scale:1}};state.selected=null;navigate('canvas');toast('已创建画布 '+title);break}
case 'quick-image':state.mode='image';state.page='canvas';render();break;case 'quick-video':state.mode='video';state.resolution='720p';state.ratio='16:9';state.page='canvas';render();break;
case 'mode':state.mode=val;if(val==='video'){state.resolution='720p';state.ratio='16:9'}else{state.resolution='2k';state.ratio='4:3'}render();break;
case 'ratio':state.ratio=val;render();break;case 'quality':state.quality=val;render();break;case 'resolution':state.resolution=val;render();break;case 'count':state.count=Number(val);render();break;case 'frame-mode':state.frameMode=val;render();break;
case 'choose-ref':document.querySelector('#ref-upload').click();break;case 'choose-assets':document.querySelector('#asset-upload').click();break;
case 'remove-ref':state.referenceIds=state.referenceIds.filter(x=>x!==id);render();break;
case 'add-ref':{const n=getNode(state.selected);if(!n||!['image','video'].includes(n.type)){toast('请先选中图片或视频节点',true);return}if(!state.referenceIds.includes(n.id))state.referenceIds.push(n.id);state.modal=null;render();toast('素材已加入参考：'+n.title);break}
case 'generate':generate();break;case 'tool':state.tool=val;connectionFrom=null;render();break;case 'add-text':addNode('text');break;case 'add-image':addNode('image');break;case 'add-video':addNode('video');break;case 'add-config':addNode('config');break;case 'undo':undo();break;case 'redo':redo();break;case 'zoom-in':canvas().view.scale=clamp(canvas().view.scale*1.18,.2,2.4);renderWorld();save();break;case 'zoom-out':canvas().view.scale=clamp(canvas().view.scale/1.18,.2,2.4);renderWorld();save();break;case 'zoom-fit':fitCanvas();break;
case 'export-json':downloadText('atelier-canvas-'+state.projectId+'.json',JSON.stringify({schemaVersion:1,projectId:state.projectId,project:state.projects.find(p=>p.id===state.projectId),...canvas(),exportedAt:new Date().toISOString()},null,2));toast('画布 JSON 已导出');break;
case 'inspector':state.activeInspector=val;render();break;case 'select-node':state.selected=id;state.activeInspector='properties';render();break;case 'delete-node':deleteNode();break;case 'duplicate':duplicateNode();break;case 'lock-node':{let n=getNode(state.selected);if(n){checkpoint();n.locked=!n.locked;render()}break}
case 'preview':if(state.selected){state.modal={kind:'media',id:state.selected};render()}break;case 'download-media':mediaDownload(getNode(state.modal?.id));break;case 'make-variant':{let n=getNode(state.selected);if(n){state.referenceIds=[n.id];state.mode='image';state.resolution='2k';state.prompt='保留参考素材的主体和风格，创作新的视觉变体：'+(n.prompt||n.title);render();toast('已自动选入参考图')}break}
case 'make-video':{let n=getNode(state.selected);if(n){state.referenceIds=[n.id];state.mode='video';state.ratio='16:9';state.resolution='720p';state.prompt='以参考图为首帧，缓慢推进镜头，柔和自然光和细微运动，保持主体一致性';render();toast('已设为视频参考素材')}break}
case 'cancel-task':{let t=state.tasks.find(x=>x.id===id);if(t&&t.userKey===state.userKey)releaseTask(t);break}case 'fail-task':{let t=state.tasks.find(x=>x.id===id);if(t&&t.userKey===state.userKey){failTask(t);toast('已模拟任务失败，积分退回')}}break;case 'retry-task':{let t=state.tasks.find(x=>x.id===id);if(!t)return;state.mode=t.type;state.prompt=t.prompt;state.ratio=t.ratio;state.quality=t.quality;state.resolution=t.resolution;state.duration=t.duration;state.count=t.count;state.referenceIds=t.referenceIds.filter(x=>!!getNode(x));generate();break}case 'focus-task':case 'task-on-canvas':canvasTaskFocus(state.tasks.find(x=>x.id===id));break;
case 'asset-filter':state.assetFilter=val;render();break;case 'insert-asset':{let a=state.assets.find(x=>x.id===id);if(!a)return;state.page='canvas';render();addNode(a.kind==='video'?'video':'image',null,null,{src:a.src,poster:a.poster,duration:a.duration,title:a.title});toast('素材已放入画布');break}
case 'send-chat':sendChat();break;case 'new-chat':state.chat=[];render();break;
case 'checkin':{const d=new Date().toISOString().slice(0,10);if(state.signed[state.userKey]===d){toast('今天已经签到了');return}state.signed[state.userKey]=d;state.creditsMap[state.userKey]+=state.settings.dailyCredits;transaction('checkin',state.settings.dailyCredits,'每日签到奖励');render();toast('签到成功，奖励 '+state.settings.dailyCredits+' 积分');break}
case 'buy-points':{const amount=Number(el.dataset.amount);state.creditsMap[state.userKey]+=amount;transaction('purchase',amount,'模拟积分套餐购买');render();toast('演示充值成功（未产生真实支付）');break}
case 'user-credit':if(!isAdmin())return;state.modal={kind:'user-credit',id};render();break;
case 'submit-credit':{const v=Number(document.querySelector('#credit-amount')?.value),note=document.querySelector('#credit-note')?.value.trim();if(!Number.isInteger(v)||!v||!note){toast('请输入整数金额与原因',true);return}const u=state.users.find(u=>u.id===state.modal.id);if(u.credits+v<0){toast('不能扣成负余额',true);return}u.credits+=v;if(u.id==='u1')state.creditsMap.user+=v;if(u.id==='u4')state.creditsMap.admin+=v;transaction('admin_adjust',v,'管理员调整：'+note,u.id==='u1'?'user':u.id==='u4'?'admin':'external-user');state.modal=null;render();toast('积分调整已记录');break}
case 'user-toggle':{if(!isAdmin())return;let u=state.users.find(u=>u.id===id);if(u.email===current().email){toast('不能禁用当前管理员的演示会话',true);return}u.status=u.status==='正常'?'已禁用':'正常';render();toast('用户状态已更新（本地模拟）');break}
case 'model-toggle':{if(!isAdmin())return;let m=state.models.find(m=>m.id===id);m.enabled=!m.enabled;render();toast('模型状态已更新');break}
case 'model-edit':state.modal={kind:'model-edit',id};render();break;
case 'submit-model-cost':{let m=state.models.find(m=>m.id===state.modal.id),v=Number(document.querySelector('#model-cost')?.value);if(!Number.isFinite(v)||v<0){toast('价格无效',true);return}m.cost=Math.round(v);state.modal=null;render();toast('模型价格已更新');break}
case 'add-model':state.modal={kind:'simple',title:'模型扩展接口',text:'演示版本预置多种图片、视频和文本模型。正式项目新增模型需配置供应商、模型能力、参数映射、价格版本和授权状态。'};render();break;
case 'provider-toggle':{let p=state.providers.find(p=>p.id===id);p.enabled=!p.enabled;render();break}
case 'new-provider':state.modal={kind:'provider'};render();break;
case 'submit-provider':{let name=document.querySelector('#provider-name').value.trim();if(!name)return toast('请输入供应商名称',true);state.providers.push({id:uid('pool'),name,kind:'授权 API 凭据池',health:'healthy',concurrency:'0 / 4',last:'未检测',enabled:false});state.modal=null;render();toast('已添加演示供应商');break}
case 'toggle-setting':if(!isSuper())return;state.settings[id]=!state.settings[id];render();break;case 'save-rules':toast('积分规则已保存至模拟状态');save();break;case 'audit':state.modal={kind:'audit'};render();break;
case 'modal-close':state.modal=null;render();break;default:console.log('Unknown action',action)
}}
document.addEventListener('click',ev=>{const nav=ev.target.closest('[data-page]');if(nav){ev.preventDefault();navigate(nav.dataset.page);return}const el=ev.target.closest('[data-action]');if(el){ev.preventDefault();execute(el.dataset.action,el);return}if(ev.target.id==='modal-back'){state.modal=null;render();return}if(state.roleOpen&&!ev.target.closest('.role-menu')){state.roleOpen=false;render()}});
document.addEventListener('input',ev=>{const el=ev.target,k=el.dataset.input;if(k){switch(k){case 'prompt':state.prompt=el.value;break;case 'duration':state.duration=Number(el.value);{const label=el.closest('.control-section')?.querySelector('.control-title .muted');if(label)label.textContent=state.duration+'s'}break;case 'style':state.style=el.value;break;case 'model':if(state.mode==='video')state.videoModel=el.value;else state.imageModel=el.value;break}if(k==='prompt'){const len=el.closest('.control-section')?.querySelector('.control-title .muted');if(len)len.textContent=state.prompt.length+' 字'}const price=document.querySelector('.studio-side-footer strong');if(price)price.textContent=cost()+' 积分 / '+(state.mode==='video'?'条':'次');save()}
const field=el.dataset.node;if(field){let n=getNode(state.selected);if(n){n[field]=el.value;const dom=document.querySelector(`[data-node-id="${n.id}"]`);if(dom){if(field==='title'){dom.querySelector('.node-head strong').textContent=el.value;const nt=dom.querySelector('.note-title');if(nt)nt.textContent=el.value}else if(field==='text'&&n.type==='text'){dom.querySelector('.node-note').lastChild.textContent=el.value}else if(field==='prompt'&&n.type==='config'){const p=dom.querySelector('.node-task p');if(p)p.textContent=el.value}}save()}}
const sk=el.dataset.setting;if(sk){state.settings[sk]=clamp(Number(el.value),0,100000);save()}});
document.addEventListener('change',ev=>{if(ev.target?.dataset?.input){save()}if(ev.target.id==='asset-upload'||ev.target.id==='ref-upload'){const where=ev.target.id==='ref-upload'?'reference':state.page==='canvas'?'canvas':'assets';const files=[...ev.target.files];files.forEach(file=>importFile(file,where));ev.target.value=''}});
let typing=false;
document.addEventListener('keydown',ev=>{const target=ev.target,inside=target.matches('input,textarea,[contenteditable="true"]');if(state.modal&&ev.key==='Escape'){state.modal=null;render();return}if(inside&&ev.key==='Enter'&&ev.ctrlKey&&target.id==='chat-input'){ev.preventDefault();sendChat();return}if(inside)return;
if(ev.code==='Space'){spaceHeld=true}if(ev.key==='Escape'){connectionFrom=null;state.tool='select';render();return}if(state.page!=='canvas')return;
if((ev.key==='Delete'||ev.key==='Backspace')&&state.selected){ev.preventDefault();deleteNode()}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();if(ev.shiftKey)redo();else undo()}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='c'){clipboard=imageCopy();if(clipboard)toast('已复制节点')}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='v'&&clipboard){ev.preventDefault();checkpoint();let cp=clone(clipboard);cp.id=uid('node');cp.x+=50;cp.y+=35;nodes().push(cp);state.selected=cp.id;render();toast('已粘贴节点')}if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();save();toast('画布已本地保存')}if(ev.key==='f'&&!ev.ctrlKey){fitCanvas()}});
document.addEventListener('keyup',ev=>{if(ev.code==='Space')spaceHeld=false});window.addEventListener('blur',()=>spaceHeld=false);
window.addEventListener('beforeunload',()=>save());
// Startup: unfinished tasks are not genuinely persisted in a timer. Explicitly restore them as cancellable demos.
state.tasks.filter(t=>!['cancelled','failed','completed'].includes(t.status)).forEach(t=>{t.status='cancelled';state.creditsMap[t.userKey]+=t.cost;transaction('release',t.cost,'原型重新加载，释放中断任务',t.userKey);const n=state.canvasMap[t.userKey+':'+t.projectId]?.nodes.find(n=>n.id===t.nodeId);if(n)n.status='cancelled'});
canvas();render();
})();
</script>
</body>
