[workspace]
members = ["crates/*"]
default-members = ["crates/app"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "uuid", "chrono", "migrate", "macros", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
utoipa = { version = "5", features = ["uuid", "chrono"] }
atelier-common = { path = "crates/common" }
atelier-auth = { path = "crates/auth" }
atelier-wallet = { path = "crates/wallet" }

chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.10"
subtle = "2"
getrandom = "0.4"
url = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
